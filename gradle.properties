# Android Studio puede sobrescribir estos ajustes desde su configuración.
# Limita la memoria del proceso de Gradle a 2 GB.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Reutiliza la configuración mientras no cambien los archivos de compilación.
org.gradle.configuration-cache=true
kotlin.code.style=official
android.disallowKotlinSourceSets=false

android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
